<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>ورود | پنل مدیریت اینستاگرام</title>
  <style>
    :root{
      color-scheme:light dark;--bg:#f5f6f8;--paper:#fff;--paper-2:#f9fafb;--ink:#16202a;--muted:#68737f;--line:#e4e8ec;
      --accent:#e23b68;--accent-2:#ff7a45;--blue:#2477e3;--green:#078765;--amber:#c97411;
      --shadow:0 14px 40px rgba(26,35,45,.08);--radius:18px;
    }
    @media(prefers-color-scheme:dark){:root{--bg:#0e1318;--paper:#161d24;--paper-2:#1a222b;--ink:#edf2f6;--muted:#a8b1bb;--line:#2a3540;--shadow:0 16px 44px rgba(0,0,0,.28)}}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.6}
    button,input{font:inherit}
    .wrap{width:min(430px,100%)}
    .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px}
    .logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#ffbc4a,#ed3c70 55%,#7a4bc9);display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:var(--shadow)}
    .brand h1{font-size:19px;margin:0}.brand p{margin:0;color:var(--muted);font-size:12px}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
    .tabs{display:flex;background:var(--paper-2);border-radius:12px;padding:4px;margin-bottom:20px}
    .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer;font-weight:700}
    .tabs button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.1)}
    .field{margin-bottom:13px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    .field input{width:100%;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:11px;padding:11px 13px}
    .field input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
    .submit{width:100%;border:0;border-radius:11px;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:800;cursor:pointer;margin-top:6px}
    .submit:disabled{opacity:.6;cursor:wait}
    .msg{display:none;border-radius:11px;padding:11px 13px;font-size:12px;margin-bottom:14px}
    .msg.show{display:block}
    .msg.error{background:#fdeef1;color:#ae294d;border:1px solid #f6ccd6}
    .msg.warn{background:#fdf6e8;color:#8a5a0b;border:1px solid #f0dfb8}
    .msg.success{background:#eaf7f1;color:#05603f;border:1px solid #bfe6d2}
    @media(prefers-color-scheme:dark){.msg.error{background:#2b1418;color:#f3a9bc;border-color:#5a2630}.msg.warn{background:#2b2210;color:#e8c877;border-color:#5a4a1e}.msg.success{background:#0f2b20;color:#8fdcb6;border-color:#1d4d38}}
    .announce{display:none;background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:11px 14px;font-size:12px;color:var(--muted);margin-bottom:16px}
    .announce.show{display:block}.announce b{color:var(--ink);display:block;font-size:13px;margin-bottom:2px}
    .hint{text-align:center;color:var(--muted);font-size:11px;margin-top:16px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">◈</div>
      <div><h1 id="siteName">پنل مدیریت اینستاگرام</h1><p>ورود امن به حساب کاربری</p></div>
    </div>

    <div class="announce" id="announce"><b>اطلاعیه</b><span id="announceText"></span></div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="active">ورود</button>
        <button id="tabSignup">ثبت‌نام</button>
      </div>

      <div class="msg" id="msg"></div>

      <form id="loginForm" autocomplete="on">
        <div class="field"><label>ایمیل</label><input type="email" id="loginEmail" required dir="ltr" style="text-align:left" placeholder="you@example.com"></div>
        <div class="field"><label>گذرواژه</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
        <button class="submit" id="loginBtn">ورود به پنل</button>
      </form>

      <form id="signupForm" class="hidden" autocomplete="on">
        <div class="field"><label>نام و نام خانوادگی</label><input type="text" id="suName" required placeholder="مثلاً یونی"></div>
        <div class="field"><label>ایمیل</label><input type="email" id="suEmail" required dir="ltr" style="text-align:left" placeholder="you@example.com"></div>
        <div class="field"><label>گذرواژه (حداقل ۸ کاراکتر)</label><input type="password" id="suPass" required minlength="8" placeholder="••••••••"></div>
        <button class="submit" id="signupBtn">ثبت‌نام</button>
        <p class="hint">حساب‌های جدید پس از تأیید مدیر فعال می‌شوند.</p>
      </form>
    </div>
    <p class="hint">با ورود، شما قوانین استفاده از این پنل را می‌پذیرید.</p>
  </div>

<script>
(function(){
  var msg=document.getElementById('msg');
  function showMsg(text,kind){msg.textContent=text;msg.className='msg show '+kind;}
  function hideMsg(){msg.className='msg';}
  function api(path,method,body){
    return fetch(path,{method:method||'GET',headers:{'Content-Type':'application/json'},
      body:body?JSON.stringify(body):undefined}).then(function(r){return r.json().then(function(j){return {status:r.status,body:j};});});
  }
  function goPanel(role){location.replace(role==='admin'?'/admin.html':'/app.html');}

  // اطلاعات سایت + اگر لاگین است، ردایرکت
  api('/api/public/site').then(function(r){
    if(r.body.ok){
      var s=r.body.site||{};
      if(s.site_name){document.getElementById('siteName').textContent=s.site_name;document.title='ورود | '+s.site_name;}
      if(s.announcement){document.getElementById('announceText').textContent=s.announcement;document.getElementById('announce').classList.add('show');}
    }
  });
  api('/api/auth/me').then(function(r){if(r.body.ok&&r.body.user)goPanel(r.body.user.role);});

  var tabLogin=document.getElementById('tabLogin'),tabSignup=document.getElementById('tabSignup'),
      loginForm=document.getElementById('loginForm'),signupForm=document.getElementById('signupForm');
  function selectTab(login){
    tabLogin.classList.toggle('active',login);tabSignup.classList.toggle('active',!login);
    loginForm.classList.toggle('hidden',!login);signupForm.classList.toggle('hidden',login);hideMsg();
  }
  tabLogin.addEventListener('click',function(){selectTab(true);});
  tabSignup.addEventListener('click',function(){selectTab(false);});

  loginForm.addEventListener('submit',function(e){
    e.preventDefault();hideMsg();
    var btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='در حال ورود…';
    api('/api/auth/login','POST',{email:document.getElementById('loginEmail').value,password:document.getElementById('loginPass').value})
    .then(function(r){
      btn.disabled=false;btn.textContent='ورود به پنل';
      if(r.body.ok){goPanel(r.body.user.role);return;}
      showMsg(r.body.message||'خطایی رخ داد.',r.body.error==='pending'?'warn':'error');
    }).catch(function(){btn.disabled=false;btn.textContent='ورود به پنل';showMsg('ارتباط با سرور برقرار نشد.','error');});
  });

  signupForm.addEventListener('submit',function(e){
    e.preventDefault();hideMsg();
    var btn=document.getElementById('signupBtn');btn.disabled=true;btn.textContent='در حال ثبت‌نام…';
    api('/api/auth/signup','POST',{name:document.getElementById('suName').value,email:document.getElementById('suEmail').value,password:document.getElementById('suPass').value})
    .then(function(r){
      btn.disabled=false;btn.textContent='ثبت‌نام';
      if(r.status===201){signupForm.reset();showMsg('ثبت‌نام انجام شد! حساب شما پس از تأیید مدیر فعال می‌شود و می‌توانید وارد شوید.','success');return;}
      showMsg(r.body.message||'خطایی رخ داد.','error');
    }).catch(function(){btn.disabled=false;btn.textContent='ثبت‌نام';showMsg('ارتباط با سرور برقرار نشد.','error');});
  });
})();
</script>
</body>
</html>
